<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2f5c">
<title>Tanda Tangan Notula · BHP Medan</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--muted:#64708a;--line:#e6eaf2;--bg:#f4f6fb;--brand:#0f2f5c;--brand2:#2457b8;--accent:#ffb703;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--hl:#ffd84d;--card:#ffffff;--r:18px;--sh:0 1px 2px rgba(20,33,61,.04),0 8px 24px rgba(20,33,61,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom);background-image:radial-gradient(circle at 10% -10%,#dfe8fb 0,transparent 40%),radial-gradient(circle at 110% 10%,#fff1d0 0,transparent 35%);background-attachment:fixed}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b2447 0%,#0f2f5c 45%,#2457b8 100%);color:#fff;padding:22px 18px 46px;padding-top:calc(22px + env(safe-area-inset-top))}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
header:before{width:220px;height:220px;right:-60px;top:-90px}
header:after{width:140px;height:140px;left:-40px;bottom:-80px;background:rgba(255,183,3,.18)}
header .brand{position:relative;display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.35;margin-bottom:14px;opacity:.95}
header .brand img{width:38px;height:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}
header .brand b{font-weight:800;letter-spacing:.06em}
header h1{position:relative;font-size:18px;font-weight:800;margin:0 0 6px;line-height:1.35;max-width:760px}
header p{position:relative;margin:0;font-size:13px;opacity:.85;font-weight:500}
main{position:relative;max-width:860px;margin:-30px auto 0;padding:0 14px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card h2{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card.me{border:0;background:linear-gradient(135deg,#ffffff 0%,#f3f7ff 100%);box-shadow:0 0 0 2px var(--brand2) inset,var(--sh)}
.card p{font-size:14px;line-height:1.6;margin:0 0 12px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font-family:inherit;transition:transform .08s,box-shadow .2s;box-shadow:0 6px 16px rgba(36,87,184,.25)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#eef2f9;color:var(--ink);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#ffd166,#ffb703);color:#3b2a00;box-shadow:0 6px 16px rgba(255,183,3,.28)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px;box-shadow:none}
.btn.danger{background:#fdecec;color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:700}
.small{font-size:12px;color:var(--muted)}
.row img.sg{height:34px;max-width:100px;object-fit:contain}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;position:relative}
.av.done:after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;background:#eef1f6;color:var(--muted)}
.pill.ok{background:#dcfce7;color:#15803d}.pill.no{background:#fef3c7;color:#b45309}.pill.bad{background:#fee2e2;color:#b91c1c}.pill.blue{background:#dbeafe;color:#1d4ed8}
.progress{height:10px;background:#eef2f9;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%),#eef2f9 0);display:flex;align-items:center;justify-content:center}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid #dbe1ec;border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 4px rgba(36,87,184,.12)}
input[type=file]{font:inherit;font-size:14px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.pages{position:relative}
.page{position:relative;margin:0 0 16px;background:#fff;box-shadow:0 2px 10px rgba(20,33,61,.12);border-radius:6px;overflow:hidden;touch-action:pan-y}
.page canvas{display:block;width:100%;height:auto}
.page .ov{position:absolute;inset:0}
.pgno{position:absolute;right:6px;bottom:6px;font-size:10px;background:rgba(15,47,92,.75);color:#fff;padding:2px 6px;border-radius:6px}
.sig{position:absolute;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;overflow:visible}
.sig img{max-width:100%;max-height:165%;flex:none}
.sbox{position:absolute;border:2px dashed var(--brand2);background:rgba(36,87,184,.10);border-radius:4px;font-size:8px;line-height:1.2;color:var(--brand2);font-weight:700;padding:1px 3px;touch-action:none;cursor:move;white-space:nowrap;overflow:visible}
.sbox .lb{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sbox.on{border-style:solid;background:rgba(31,79,147,.18)}
.sbox .rz{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:var(--brand2);border:2px solid #fff}
.pin{position:absolute;transform:translate(-50%,-100%);width:28px;height:34px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:drop .35s cubic-bezier(.2,1.6,.4,1)}
.pin span{position:absolute;inset:0 0 6px 0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:block}
.pin b{position:absolute;top:5px;left:0;right:0;text-align:center;color:#fff;font-size:12px}
.pin.done{opacity:.55}
.mark{position:absolute;border-radius:3px;pointer-events:auto;cursor:pointer;mix-blend-mode:multiply}
.mark.draft{outline:2px dashed rgba(0,0,0,.35)}
@keyframes drop{from{transform:translate(-50%,-160%) scale(.4);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.korbar{position:fixed;left:8px;right:8px;bottom:8px;border-radius:20px;z-index:20;background:rgba(15,32,66,.94);backdrop-filter:blur(8px);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.25);display:none}
.korbar.on{display:block;animation:up .25s}
.korbar .t{font-size:13px;margin-bottom:8px;line-height:1.4}
.korbar .btn{padding:10px 12px;font-size:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
body.koreksi .page{outline:3px solid var(--hl);cursor:crosshair;touch-action:pan-y}
body.koreksi.stabilo .page{touch-action:none;outline-color:#ff922b}
body.koreksi main{padding-bottom:170px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .lead{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.5}
.big-emoji{font-size:44px;text-align:center;margin:4px 0 6px}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choice .btn{text-align:left;padding:14px 16px;font-size:15px;display:flex;gap:12px;align-items:center}
.choice .btn small{display:block;font-weight:normal;font-size:12px;opacity:.8;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:600;border:1.5px solid #dbe1ec;background:#fff;border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{border-color:var(--c,#1f4f93);background:var(--c,#1f4f93);color:#fff}
canvas#cv{width:100%;height:230px;border:1.5px dashed #9aa4b5;border-radius:12px;touch-action:none;background:#fff linear-gradient(transparent 75%,#eef1f6 75%,#eef1f6 calc(75% + 1px),transparent calc(75% + 1px));display:block}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#1b2b4d;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,top .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.kitem{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.kitem .h{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.kitem .num{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none}
.kitem .tx{font-size:14px;line-height:1.5}
.kitem del{color:var(--bad)}
.kitem ins{color:var(--ok);text-decoration:none;font-weight:bold}
.reply{font-size:13px;background:#f3f6fb;border-radius:8px;padding:6px 8px;margin-top:6px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 0}
.linkbox{display:flex;gap:6px;align-items:center;margin-top:6px}
.linkbox input{font-size:12px;padding:7px 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tab{border:0;background:#e8ecf2;border-radius:99px;padding:8px 14px;font-weight:bold;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
.tab.on{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:20px;justify-content:center}
.spin{width:18px;height:18px;border:3px solid #cdd3dd;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hello{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-12px);background:#fff;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:0 10px 30px rgba(15,47,92,.22);z-index:58;opacity:0;transition:opacity .35s,transform .35s;max-width:92vw;width:max-content;pointer-events:none}
.hello.on{opacity:1;transform:translate(-50%,0)}
.hello b{color:var(--brand)}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="brand"><img src="/logo.png" alt="Logo Kementerian Hukum"><span>Kementerian Hukum Republik Indonesia<br><b>Balai Harta Peninggalan Medan</b></span></div><h1 id="hTitle">Tanda Tangan Notula</h1><p id="hSub">Balai Harta Peninggalan Medan</p></header>
<main id="app"><div class="loading"><div class="spin"></div>Memuat...</div></main>

<div class="korbar" id="korbar">
  <div class="t" id="kbTip">✏️ <b>Mode koreksi.</b> Ketuk bagian yang perlu dikoreksi. Aktifkan Stabilo untuk menandai satu area.</div>
  <div class="btns" style="margin-bottom:8px"><button class="btn sec" id="kbMode">🖍️ Stabilo: mati</button></div>
  <div class="btns">
    <button class="btn sec" id="kbList">📋 Koreksi saya (<span id="kbCount">0</span>)</button>
    <button class="btn" id="kbSend" disabled>Kirim koreksi 🚀</button>
    <button class="btn sec" id="kbExit">Keluar</button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="hello" id="hello"></div>
<canvas id="confetti"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const LEGACY_ID = 'notula-20261113';
const CATS = [
  { id: 'ketik', label: '✍️ Salah ketik', c: '#d9480f' },
  { id: 'nama', label: '👤 Nama/Jabatan', c: '#7048e8' },
  { id: 'angka', label: '📅 Tanggal/Angka', c: '#1971c2' },
  { id: 'isi', label: '📝 Isi/Substansi', c: '#c2255c' },
  { id: 'tambah', label: '➕ Perlu ditambah', c: '#2b8a3e' },
  { id: 'hapus', label: '✂️ Perlu dihapus', c: '#e03131' },
  { id: 'lain', label: '💬 Lainnya', c: '#495057' },
];
const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const STATUS = { baru: ['Baru', 'blue'], diproses: ['Diproses', 'no'], selesai: ['Selesai ✓', 'ok'], dibatalkan: ['Dibatalkan', ''] };

const qs = new URLSearchParams(location.search);
let DOC_ID = qs.get('d'), ME_KEY = qs.get('n'), TOK = qs.get('k'), VIEW = qs.get('v');
const ADMIN_URL = qs.get('admin');
let ADMIN = ADMIN_URL || (() => { try { return localStorage.getItem('adminKey'); } catch (e) { return null; } })();
const adminHome = () => ADMIN_URL ? '/?admin=' + encodeURIComponent(ADMIN_URL) : '/?kelola';
const adminDoc = id => '/?d=' + encodeURIComponent(id) + (ADMIN_URL ? '&admin=' + encodeURIComponent(ADMIN_URL) : '');
const authQS = () => 'k=' + encodeURIComponent(ADMIN || TOK || '') + (VIEW ? '&v=' + encodeURIComponent(VIEW) : '');
const pdfUrl = () => '/api/docs/' + encodeURIComponent(DOC_ID) + '/pdf?' + authQS() + '&ver=' + (S.doc ? S.doc.ver : 1);
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = iso => { try { return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB'; } catch (e) { return iso; } };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

async function api(path, opt = {}) {
  const r = await fetch('/api/' + path, { cache: 'no-store', ...opt, headers: { 'content-type': 'application/json', ...(opt.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function openSheet(html, onMount) { $('sheet').innerHTML = html; $('modal').classList.add('on'); onMount && onMount($('sheet')); }
function closeSheet() { $('modal').classList.remove('on'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('modal').dataset.lock) closeSheet(); });
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Link disalin 📋'); } catch (e) { prompt('Salin link ini:', text); } }

// ---------------- konfeti ----------------
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffd84d', '#2a9d62', '#1f4f93', '#e03131', '#7048e8', '#ff922b'];
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  let f = 0; (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (++f < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

// ---------------- render PDF ----------------
let PDF = null, PAGES = [];
async function renderPdf(container, url) {
  container.innerHTML = '<div class="loading"><div class="spin"></div>Memuat notula...</div>';
  PDF = await pdfjsLib.getDocument({ url }).promise;
  container.innerHTML = ''; PAGES = [];
  const width = Math.min(container.clientWidth || 800, 860), dpr = Math.min(2.5, Math.max(1.5, devicePixelRatio || 1));
  for (let i = 1; i <= PDF.numPages; i++) {
    const page = await PDF.getPage(i);
    const vp1 = page.getViewport({ scale: 1 }), scale = width / vp1.width * dpr, vp = page.getViewport({ scale });
    const wrap = document.createElement('div'); wrap.className = 'page'; wrap.dataset.page = i; wrap.id = 'pg' + i;
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    const ov = document.createElement('div'); ov.className = 'ov';
    const no = document.createElement('div'); no.className = 'pgno'; no.textContent = 'Hal. ' + i + '/' + PDF.numPages;
    wrap.append(cv, ov, no); container.appendChild(wrap);
    PAGES.push({ wrap, ov, cv });
    cv.dataset.w = vp.width; cv.dataset.h = vp.height; cv.style.aspectRatio = vp.width + ' / ' + vp.height;
    lazyRender(cv, page, vp);
  }
}
const ovOf = p => PAGES[p - 1]?.ov;
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); e.target._render(); } }), { rootMargin: '800px 0px' }) : null;
function lazyRender(cv, page, vp) {
  cv._render = () => page.render({ canvasContext: cv.getContext('2d'), viewport: vp });
  if (io) io.observe(cv); else cv._render();
}


// ---------------- avatar inisial ----------------
const AVC = ['#2457b8', '#7048e8', '#0ca678', '#e8590c', '#c2255c', '#1098ad', '#5f3dc4', '#d9480f'];
function avatar(name, done) {
  const ini = String(name).replace(/,.*$/, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<div class="av${done ? ' done' : ''}" style="background:${AVC[h % AVC.length]}">${esc(ini)}</div>`;
}
// ---------------- sapaan otomatis ----------------
function salam() {
  const h = new Date().getHours(); // jam di perangkat yang membuka link
  return h >= 4 && h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam';
}
function greet(s) {
  const el = $('hello'); if (!el || !s) return;
  el.innerHTML = `Selamat ${salam()} ${esc(s.sapaan || 'Bapak/Ibu')} <b>${esc(s.name)}</b>, apa cerita hari ini? ☺️`;
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => el.classList.remove('on'), 2000);
}
// nama berkas yang rapi
function fileName(suffix) {
  const d = S.doc, m = (d.subtitle || '').match(/\d{1,2}\s+[A-Za-z]+\s+\d{4}/);
  let base = d.title.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (m && !base.includes(m[0])) base += ' - ' + m[0];
  if (d.ver > 1) base += ' (Revisi ' + (d.ver - 1) + ')';
  return base + (suffix ? ' ' + suffix : '') + '.pdf';
}

// ================= STATE =================
let S = { doc: null, sigs: {}, kor: [], admin: null };
let drafts = [];
const draftKey = () => 'kor:' + DOC_ID + ':' + ME_KEY;
const me = () => S.doc && ME_KEY && TOK ? S.doc.signers.find(s => s.key === ME_KEY) : null;
const sigOk = s => S.sigs[s.key] && S.sigs[s.key].ver === S.doc.ver;

async function loadDoc() {
  const j = await api('docs/' + encodeURIComponent(DOC_ID) + '?' + authQS());
  S.doc = j.doc; S.sigs = j.sigs || {}; S.kor = j.koreksi || [];
}

// ================= HALAMAN NOTULA =================
let VIEW_TAB = 'status';
async function showDoc() {
  try { await loadDoc(); } catch (e) { app.innerHTML = '<div class="card"><p>Notula tidak dapat dimuat: ' + esc(e.message) + '</p></div>'; return; }
  $('hTitle').textContent = S.doc.title; $('hSub').textContent = S.doc.subtitle || 'Balai Harta Peninggalan Medan';
  document.title = fileName('').replace(/ ?\.pdf$/, '') + ' · Tanda Tangan';
  drafts = store.get(draftKey(), []);
  app.innerHTML = `
    <div id="meCard"></div>
    <div id="adminCard"></div>
    <div class="card"><div class="stat"><div class="ring" id="ring"><span id="ringTx">0%</span></div><div class="grow"><h2 style="margin:0 0 4px">Status Tanda Tangan</h2><div class="small" id="prog"></div></div></div><div class="progress"><i id="bar" style="width:0"></i></div><div id="list"></div>
      <div class="btns" style="margin-top:12px"><button class="btn sec" id="dl">⬇️ Unduh PDF bertanda tangan</button></div></div>
    <div class="card" id="korCard"></div>
    <div class="card"><h2>Isi Notula</h2><p class="small" style="margin:0 0 10px">Tanda tangan muncul otomatis di kolomnya. Penanda 📍 adalah koreksi dari peserta, ketuk untuk melihat.</p><div class="pages" id="pages"></div></div>`;
  $('dl').onclick = downloadPdf;
  renderStatic();
  await renderPdf($('pages'), pdfUrl());
  renderOverlays();
  if (ADMIN) loadAdmin();
  if (me()) greet(me());
  if (location.hash === '#ttd' && me()) startSignFlow();
  setInterval(refresh, 25000);
}
async function refresh() {
  if (document.hidden || $('modal').classList.contains('on') || document.body.classList.contains('koreksi')) return;
  const oldVer = S.doc.ver;
  try { await loadDoc(); } catch (e) { return; }
  if (S.doc.ver !== oldVer) { await renderPdf($('pages'), pdfUrl()); toast('📄 Notula diperbarui ke versi terbaru'); }
  renderStatic(); renderOverlays();
}

function renderStatic() {
  const d = S.doc, done = d.signers.filter(sigOk).length;
  $('prog').textContent = done + ' dari ' + d.signers.length + ' sudah menandatangani' + (d.ver > 1 ? ' · versi revisi ke-' + (d.ver - 1) : '');
  const pct = d.signers.length ? Math.round(done / d.signers.length * 100) : 0;
  $('bar').style.width = pct + '%'; $('ring').style.setProperty('--p', pct); $('ringTx').textContent = pct + '%';
  $('list').innerHTML = d.signers.map(s => {
    const sg = S.sigs[s.key], ok = sigOk(s), old = sg && !ok;
    return `<div class="row">${avatar(s.name, ok)}<div class="grow"><b>${esc(s.name)}</b><span class="small">${ok ? 'Ditandatangani ' + fmt(sg.at) : old ? 'Perlu tanda tangan ulang (ada revisi)' : esc(s.role)}</span></div>
      ${ok ? `<img class="sg" src="${sg.img}" alt="">` : ''}<span class="pill ${ok ? 'ok' : old ? 'bad' : 'no'}">${ok ? 'Sudah' : old ? 'Ulang' : 'Belum'}</span>
      ${ADMIN && sg ? `<button class="btn sm danger" data-reset="${esc(s.key)}">Hapus</button>` : ''}</div>`;
  }).join('');
  $('list').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetSig(b.dataset.reset));
  // kartu pribadi
  const m = me(), mc = $('meCard');
  if (ME_KEY && !m) mc.innerHTML = '<div class="card me"><p>Link tanda tangan tidak lengkap atau tidak berlaku. Mohon gunakan link yang dikirimkan kepada Bapak/Ibu.</p></div>';
  else if (m) {
    const ok = sigOk(m), myKor = S.kor.filter(c => c.by === m.key && c.status !== 'dibatalkan');
    mc.innerHTML = `<div class="card me"><p>${ok ? `✅ Terima kasih, ${esc(m.sapaan || 'Bapak/Ibu')} <b>${esc(m.name)}</b>. Tanda tangan ${esc(m.sapaan || 'Bapak/Ibu')} sudah tersimpan di notula (${fmt(S.sigs[m.key].at)}).`
      : `Yth. ${esc(m.sapaan || 'Bapak/Ibu')} <b>${esc(m.name)}</b>${m.role ? ' (' + esc(m.role) + ')' : ''}, silakan membaca notula di bawah, lalu tekan tombol berikut untuk menandatangani.`}</p>
      ${myKor.length ? `<p class="small">Bapak/Ibu telah mengirim ${myKor.length} koreksi, ${myKor.filter(c => c.status === 'selesai').length} sudah ditindaklanjuti.</p>` : ''}
      <div class="btns"><button class="btn" id="goSign">${ok ? '🔁 Ulangi tanda tangan' : '✍️ Tanda tangani sekarang'}</button><button class="btn warn" id="goKor">✏️ Ajukan koreksi</button></div></div>`;
    $('goSign').onclick = startSignFlow; $('goKor').onclick = enterKoreksi;
  } else mc.innerHTML = '';
  renderKorCard();
  updateKorbar();
}

// ---------------- overlays: ttd, koreksi, draft ----------------
function place(el, x, y, w, h) { Object.assign(el.style, { left: x * 100 + '%', top: y * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' }); }
function renderOverlays() {
  PAGES.forEach(p => p.ov.innerHTML = '');
  for (const s of S.doc.signers) {
    if (!sigOk(s) || !ovOf(s.page)) continue;
    const b = document.createElement('div'); b.className = 'sig'; place(b, s.x, s.y, s.w, s.h);
    b.innerHTML = `<img src="${S.sigs[s.key].img}" alt="Tanda tangan ${esc(s.name)}">`; ovOf(s.page).appendChild(b);
  }
  const vis = S.kor.filter(c => c.status !== 'dibatalkan');
  vis.forEach((c, i) => drawKor(c, String(i + 1), false));
  drafts.forEach((c, i) => drawKor(c, '✎' + (i + 1), true, i));
}
function drawKor(c, label, isDraft, di) {
  const ov = ovOf(c.page); if (!ov) return;
  const col = catOf(c.cat).c;
  if (c.w > 0.01 && c.h > 0.005) {
    const m = document.createElement('div'); m.className = 'mark' + (isDraft ? ' draft' : ''); place(m, c.x, c.y, c.w, c.h);
    m.style.background = col + '33'; m.style.border = '2px solid ' + col; ov.appendChild(m);
    m.onclick = e => { e.stopPropagation(); isDraft ? editDraft(di) : showKor(c); };
  }
  const p = document.createElement('div'); p.className = 'pin' + (c.status === 'selesai' ? ' done' : '');
  p.style.left = (c.x + (c.w > 0.01 ? c.w : 0)) * 100 + '%'; p.style.top = c.y * 100 + '%';
  p.innerHTML = `<span style="background:${col}${isDraft ? ';outline:2px dashed #fff' : ''}"></span><b>${c.status === 'selesai' ? '✓' : esc(label)}</b>`;
  p.onclick = e => { e.stopPropagation(); isDraft ? editDraft(di) : showKor(c); };
  ov.appendChild(p);
}

// ---------------- daftar koreksi ----------------
function korItem(c, i, opts = {}) {
  const cat = catOf(c.cat), st = STATUS[c.status] || STATUS.baru, m = me();
  const agreed = m && (c.agree || []).includes(m.key);
  return `<div class="kitem" style="--c:${cat.c}"><div class="h"><span class="num">${opts.label || i + 1}</span><b class="small" style="color:${cat.c}">${cat.label}</b>
    <span class="small">Hal. ${c.page}</span>${c.status ? `<span class="pill ${st[1]}">${st[0]}</span>` : ''}</div>
    <div class="tx">${c.from ? `<del>${esc(c.from)}</del> → ` : ''}${c.to ? `<ins>${esc(c.to)}</ins>` : ''}${c.note ? `<div>${esc(c.note)}</div>` : ''}</div>
    ${c.byName ? `<div class="small" style="margin-top:4px">oleh ${esc(c.byName)} · ${fmt(c.at)}${(c.agree || []).length ? ' · 👍 ' + c.agree.length : ''}</div>` : ''}
    ${c.reply ? `<div class="reply">💬 Admin: ${esc(c.reply)}</div>` : ''}
    <div class="btns" style="margin-top:8px">
      <button class="btn sm sec" data-go="${c.page}">🔎 Lihat</button>
      ${opts.draft ? `<button class="btn sm sec" data-edit="${i}">Ubah</button><button class="btn sm danger" data-del="${i}">Hapus</button>` : ''}
      ${!opts.draft && m && c.by !== m.key && c.status !== 'selesai' ? `<button class="btn sm ${agreed ? '' : 'sec'}" data-agree="${c.id}">👍 ${agreed ? 'Setuju' : 'Saya setuju'}</button>` : ''}
      ${!opts.draft && m && c.by === m.key && c.status === 'baru' ? `<button class="btn sm danger" data-cancel="${c.id}">Batalkan</button>` : ''}
      ${!opts.draft && ADMIN ? `<select data-st="${c.id}" style="width:auto;padding:6px 8px;font-size:12px">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === c.status ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
        <button class="btn sm sec" data-reply="${c.id}">💬 Balas</button>` : ''}
    </div></div>`;
}
function bindKorButtons(root) {
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeSheet(); $('pg' + b.dataset.go)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDraft(+b.dataset.edit));
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { drafts.splice(+b.dataset.del, 1); saveDrafts(); showDraftList(); });
  root.querySelectorAll('[data-agree]').forEach(b => b.onclick = async () => {
    const c = S.kor.find(x => x.id === b.dataset.agree), on = !(c.agree || []).includes(ME_KEY);
    try { await api('docs/' + DOC_ID + '/koreksi', { method: 'PATCH', body: JSON.stringify({ id: c.id, key: ME_KEY, k: TOK, agree: on }) }); toast(on ? '👍 Dukungan tercatat' : 'Dukungan dibatalkan'); await afterChange(); } catch (e) { toast('⚠️ ' + e.message); }
  });
  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    try { await api('docs/' + DOC_ID + '/koreksi', { method: 'PATCH', body: JSON.stringify({ id: b.dataset.cancel, key: ME_KEY, k: TOK, status: 'dibatalkan' }) }); toast('Koreksi dibatalkan'); await afterChange(); } catch (e) { toast('⚠️ ' + e.message); }
  });
  root.querySelectorAll('[data-st]').forEach(s => s.onchange = async () => {
    try { await api('docs/' + DOC_ID + '/koreksi', { method: 'PATCH', body: JSON.stringify({ id: s.dataset.st, k: ADMIN, status: s.value }) }); toast('Status diperbarui'); await afterChange(); } catch (e) { toast('⚠️ ' + e.message); }
  });
  root.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => {
    const c = S.kor.find(x => x.id === b.dataset.reply);
    openSheet(`<h3>💬 Balas koreksi</h3><p class="lead">${esc(c.from ? c.from + ' → ' : '')}${esc(c.to || c.note)}</p><textarea id="rp" placeholder="Contoh: Sudah diperbaiki di revisi.">${esc(c.reply || '')}</textarea>
      <div class="btns" style="margin-top:10px"><button class="btn sec" onclick="closeSheet()">Batal</button><button class="btn" id="rpOk">Kirim balasan</button></div>`, sh => {
      sh.querySelector('#rpOk').onclick = async () => { try { await api('docs/' + DOC_ID + '/koreksi', { method: 'PATCH', body: JSON.stringify({ id: c.id, k: ADMIN, reply: sh.querySelector('#rp').value }) }); closeSheet(); toast('Balasan terkirim'); await afterChange(); } catch (e) { toast('⚠️ ' + e.message); } };
    });
  });
}
async function afterChange() { await loadDoc(); renderStatic(); renderOverlays(); }
function renderKorCard() {
  const el = $('korCard'); if (!el) return;
  const vis = S.kor.map((c, i) => ({ c, i })).filter(x => x.c.status !== 'dibatalkan');
  const open = vis.filter(x => x.c.status !== 'selesai').length;
  if (!vis.length && !me() && !ADMIN) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = `<h2>Koreksi Peserta ${vis.length ? `<span class="pill ${open ? 'no' : 'ok'}">${open ? open + ' belum selesai' : 'Semua selesai ✓'}</span>` : ''}</h2>
    ${vis.length ? vis.map(x => korItem(x.c, vis.indexOf(x))).join('') : '<div class="empty">Belum ada koreksi. 👍</div>'}`;
  bindKorButtons(el);
}
function showKor(c) {
  const i = S.kor.filter(x => x.status !== 'dibatalkan').indexOf(c);
  openSheet(`<h3>Koreksi #${i + 1}</h3>${korItem(c, i)}<div class="btns" style="margin-top:6px"><button class="btn sec" onclick="closeSheet()">Tutup</button></div>`, sh => bindKorButtons(sh));
}

// ================= ALUR TANDA TANGAN: tanya koreksi dulu =================
function startSignFlow() {
  const m = me(); if (!m) return;
  openSheet(`<div class="big-emoji">🧐</div><h3 style="text-align:center">Apakah ada koreksi pada notula ini?</h3>
    <p class="lead" style="text-align:center">Sebelum menandatangani, pastikan isi notula sudah sesuai dengan jalannya rapat.</p>
    <div class="choice">
      <button class="btn warn" id="cYes"><span style="font-size:24px">✏️</span><span>Ya, ada koreksi<small>Tandai langsung bagian yang perlu diperbaiki</small></span></button>
      <button class="btn" id="cNo"><span style="font-size:24px">✅</span><span>Tidak ada, notula sudah sesuai<small>Lanjut ke tanda tangan</small></span></button>
      <button class="btn sec" onclick="closeSheet()">Nanti dulu</button>
    </div>`, sh => {
    sh.querySelector('#cYes').onclick = () => { closeSheet(); enterKoreksi(); };
    sh.querySelector('#cNo').onclick = () => openPad();
  });
}

// ================= MODE KOREKSI =================
function saveDrafts() { store.set(draftKey(), drafts); updateKorbar(); renderOverlays(); }
function updateKorbar() { $('kbCount').textContent = drafts.length; $('kbSend').disabled = !drafts.length; }
function enterKoreksi() {
  if (!me()) return;
  document.body.classList.add('koreksi'); $('korbar').classList.add('on');
  if (!store.get('korTip', false)) {
    openSheet(`<div class="big-emoji">🖍️</div><h3 style="text-align:center">Cara mengoreksi</h3>
      <div class="kitem" style="--c:#1f4f93"><div class="tx">👆 <b>Ketuk</b> kata atau kalimat yang salah untuk menaruh penanda.</div></div>
      <div class="kitem" style="--c:#2b8a3e"><div class="tx">🖍️ Nyalakan <b>Stabilo</b>, lalu geser jari untuk menandai satu paragraf atau area.</div></div>
      <div class="kitem" style="--c:#c2255c"><div class="tx">📋 Semua koreksi tersimpan sementara di HP, lalu tekan <b>Kirim koreksi</b> jika sudah selesai.</div></div>
      <div class="btns"><button class="btn" id="tipOk">Mengerti, mulai koreksi</button></div>`, sh => sh.querySelector('#tipOk').onclick = () => { store.set('korTip', true); closeSheet(); });
  } else toast('✏️ Ketuk bagian notula yang perlu dikoreksi');
}
function exitKoreksi() { document.body.classList.remove('koreksi', 'stabilo'); $('kbMode').textContent = '🖍️ Stabilo: mati'; $('kbMode').className = 'btn sec'; $('korbar').classList.remove('on'); }
$('kbExit').onclick = () => {
  if (drafts.length) openSheet(`<h3>Keluar dari mode koreksi?</h3><p class="lead">Ada ${drafts.length} koreksi yang belum dikirim. Koreksi tetap tersimpan di HP ini dan bisa dikirim nanti.</p>
    <div class="btns"><button class="btn sec" id="xNo">Lanjut koreksi</button><button class="btn" id="xYes">Keluar</button></div>`, sh => { sh.querySelector('#xNo').onclick = closeSheet; sh.querySelector('#xYes').onclick = () => { closeSheet(); exitKoreksi(); }; });
  else exitKoreksi();
};
$('kbList').onclick = showDraftList;
$('kbMode').onclick = () => {
  const on = document.body.classList.toggle('stabilo');
  $('kbMode').textContent = on ? '🖍️ Stabilo: aktif (geser jari untuk menandai)' : '🖍️ Stabilo: mati';
  $('kbMode').className = 'btn ' + (on ? 'warn' : 'sec');
  toast(on ? '🖍️ Geser jari untuk menandai area. Matikan Stabilo untuk menggulir.' : '📌 Ketuk untuk menaruh penanda, geser untuk menggulir');
};
$('kbSend').onclick = sendKoreksi;
function showDraftList() {
  openSheet(`<h3>📋 Koreksi saya (${drafts.length})</h3>${drafts.length ? drafts.map((c, i) => korItem(c, i, { draft: true, label: '✎' + (i + 1) })).join('') : '<div class="empty">Belum ada koreksi. Ketuk bagian notula untuk menambah.</div>'}
    <div class="btns"><button class="btn sec" onclick="closeSheet()">Tambah lagi</button>${drafts.length ? '<button class="btn" id="dlSend">Kirim koreksi 🚀</button>' : ''}</div>`, sh => {
    bindKorButtons(sh); const b = sh.querySelector('#dlSend'); if (b) b.onclick = sendKoreksi;
  });
}
// ketuk / seret di halaman
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('koreksi')) return;
  const pg = e.target.closest('.page'); if (!pg || e.target.closest('.pin,.mark')) return;
  const stab = document.body.classList.contains('stabilo');
  if (stab) e.preventDefault();
  const r = pg.getBoundingClientRect();
  drag = { stab, sx: e.clientX, sy: e.clientY, moved: false, pg, r, x0: (e.clientX - r.left) / r.width, y0: (e.clientY - r.top) / r.height, x1: null, y1: null, el: null };
  pg.setPointerCapture?.(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) drag.moved = true;
  if (!drag.stab) return;
  const { r } = drag; drag.x1 = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); drag.y1 = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  if (Math.abs(drag.x1 - drag.x0) * r.width > 12 || Math.abs(drag.y1 - drag.y0) * r.height > 12) {
    if (!drag.el) { drag.el = document.createElement('div'); drag.el.className = 'mark draft'; drag.el.style.background = 'rgba(255,216,77,.45)'; drag.pg.querySelector('.ov').appendChild(drag.el); }
    place(drag.el, Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1), Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
  }
});
document.addEventListener('pointercancel', () => { if (drag?.el) drag.el.remove(); drag = null; });
document.addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.stab && d.moved) return; // sedang menggulir
  const page = +d.pg.dataset.page;
  let item;
  if (d.el) { d.el.remove(); item = { page, x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) }; }
  else item = { page, x: d.x0, y: d.y0 + 0.004, w: 0, h: 0 };
  korForm(item, -1);
});
function korForm(item, idx) {
  const it = { cat: store.get('lastCat', 'ketik'), from: '', to: '', note: '', ...item };
  openSheet(`<h3>${idx < 0 ? '✏️ Koreksi baru' : '✏️ Ubah koreksi'} <span class="small">· Hal. ${it.page}</span></h3>
    <label class="f">Jenis koreksi</label><div class="chips" id="cats">${CATS.map(c => `<button class="chip ${c.id === it.cat ? 'on' : ''}" style="--c:${c.c}" data-c="${c.id}">${c.label}</button>`).join('')}</div>
    <label class="f">Tertulis di notula <span style="font-weight:normal">(boleh dikosongkan)</span></label><input type="text" id="kFrom" value="${esc(it.from)}" placeholder="Contoh: Elsinta Damayanti">
    <label class="f" id="kToLbl">Seharusnya</label><input type="text" id="kTo" value="${esc(it.to)}" placeholder="Contoh: Elsintha Damayanti">
    <label class="f">Catatan tambahan <span style="font-weight:normal">(opsional)</span></label><textarea id="kNote" placeholder="Jelaskan jika perlu">${esc(it.note)}</textarea>
    <div class="btns" style="margin-top:12px">${idx >= 0 ? '<button class="btn danger" id="kDel">Hapus</button>' : ''}<button class="btn sec" id="kCancel">Batal</button><button class="btn" id="kOk">Simpan 📌</button></div>`, sh => {
    const setLbl = () => { const c = it.cat; sh.querySelector('#kToLbl').textContent = c === 'tambah' ? 'Yang perlu ditambahkan' : c === 'hapus' ? 'Alasan dihapus' : 'Seharusnya'; };
    setLbl();
    sh.querySelectorAll('.chip').forEach(b => b.onclick = () => { it.cat = b.dataset.c; sh.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); setLbl(); });
    sh.querySelector('#kCancel').onclick = closeSheet;
    if (idx >= 0) sh.querySelector('#kDel').onclick = () => { drafts.splice(idx, 1); saveDrafts(); closeSheet(); toast('Koreksi dihapus'); };
    sh.querySelector('#kOk').onclick = () => {
      it.from = sh.querySelector('#kFrom').value.trim(); it.to = sh.querySelector('#kTo').value.trim(); it.note = sh.querySelector('#kNote').value.trim();
      if (!it.to && !it.note && it.cat !== 'hapus') { toast('Isi "Seharusnya" atau catatan dulu ya 🙏'); return; }
      store.set('lastCat', it.cat);
      if (idx < 0) drafts.push(it); else drafts[idx] = it;
      saveDrafts(); closeSheet();
      toast(idx < 0 ? `📌 Koreksi #${drafts.length} ditambahkan` : 'Koreksi diperbarui');
    };
    setTimeout(() => sh.querySelector(it.from ? '#kTo' : '#kFrom')?.focus(), 250);
  });
}
function editDraft(i) { korForm(drafts[i], i); }
async function sendKoreksi() {
  if (!drafts.length) return;
  $('kbSend').disabled = true;
  try {
    const r = await api('docs/' + DOC_ID + '/koreksi', { method: 'POST', body: JSON.stringify({ key: ME_KEY, k: TOK, items: drafts }) });
    drafts = []; saveDrafts(); exitKoreksi(); confetti(); await afterChange();
    openSheet(`<div class="big-emoji">🎉</div><h3 style="text-align:center">Terima kasih! ${r.count} koreksi terkirim</h3>

// ================= PAD TANDA TANGAN (pena tinta basah) =================
const INK = '#111111'; // tinta pulpen hitam
function openPad() {
  const m = me();
  $('modal').dataset.lock = '1';
  openSheet(`<h3>✍️ Tanda tangan: ${esc(m.name)}</h3><p class="lead">Coret tanda tangan dengan jari atau stylus di kotak di bawah ini.</p>
    <canvas id="cv"></canvas>
    <div class="btns" style="margin-top:10px"><button class="btn sec" id="pClr">↺ Ulangi</button><button class="btn sec" id="pCancel">Batal</button><button class="btn" id="pSave" disabled>Simpan</button></div>
    <div class="small" id="pMsg" style="margin-top:8px"></div>`, sh => {
    const cv = sh.querySelector('#cv'), ctx = cv.getContext('2d'); let drawing = false, dirty = false, pts = [], lastW = 2.2;
    const save = sh.querySelector('#pSave');
    function size() {
      const r = cv.getBoundingClientRect(), dpr = Math.max(2, devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.fillStyle = INK;
      ctx.clearRect(0, 0, r.width, r.height); dirty = false; save.disabled = true;
    }
    requestAnimationFrame(size);
    const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now(), p: e.pressure }; };
    function widthFor(a, b) {
      const v = Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, b.t - a.t);
      let w = 2.3 - Math.min(v, 3) * 0.35;                 // pulpen: tebal-tipis halus, tidak berlebihan
      if (b.p && b.p > 0 && b.p !== 0.5) w *= 0.85 + b.p * 0.3;
      w = Math.max(1.1, Math.min(2.5, w)); lastW = lastW * 0.75 + w * 0.25; return lastW;
    }
    function seg(p0, p1, p2, w0, w1) {
      const m1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 }, m2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const n = Math.max(2, Math.ceil(Math.hypot(m2.x - m1.x, m2.y - m1.y) / 1.5)); let px = m1.x, py = m1.y;
      ctx.globalAlpha = 1;
      for (let i = 1; i <= n; i++) { const t = i / n, u = 1 - t, x = u * u * m1.x + 2 * u * t * p1.x + t * t * m2.x, y = u * u * m1.y + 2 * u * t * p1.y + t * t * m2.y;
        ctx.lineWidth = w0 + (w1 - w0) * t; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke(); px = x; py = y; }
      ctx.globalAlpha = 1;
    }
    cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; lastW = 1.9; const p = pt(e); pts = [p, p]; ctx.beginPath(); ctx.arc(p.x, p.y, 0.95, 0, 7); ctx.fill(); });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return; e.preventDefault();
      for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) {
        const p = pt(ev), a = pts[pts.length - 1]; if (Math.hypot(p.x - a.x, p.y - a.y) < 0.8) continue;
        const w0 = lastW, w1 = widthFor(a, p); pts.push(p); const n = pts.length; seg(pts[n - 3], pts[n - 2], pts[n - 1], w0, w1);
      }
      dirty = true; save.disabled = false;
    });
    const end = () => { if (!drawing) return; drawing = false; const n = pts.length; if (n >= 2) { const a = pts[n - 2], b = pts[n - 1]; ctx.lineWidth = Math.max(1, lastW * 0.75); ctx.beginPath(); ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2); ctx.lineTo(b.x, b.y); ctx.stroke(); } pts = []; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, end));
    sh.querySelector('#pClr').onclick = size;
    sh.querySelector('#pCancel').onclick = () => { delete $('modal').dataset.lock; closeSheet(); };
    function trimmed() {
      const w = cv.width, h = cv.height, px = ctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (px[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0) return null; const pad = 10, sw = x1 - x0 + pad * 2, sh2 = y1 - y0 + pad * 2, sc = Math.min(1, 900 / sw, 380 / sh2);
      const o = document.createElement('canvas'); o.width = Math.round(sw * sc); o.height = Math.round(sh2 * sc);
      o.getContext('2d').drawImage(cv, x0 - pad, y0 - pad, sw, sh2, 0, 0, o.width, o.height); return o.toDataURL('image/png');
    }
    save.onclick = async () => {
      const img = dirty && trimmed(); if (!img) return; save.disabled = true; sh.querySelector('#pMsg').textContent = 'Menyimpan...';
      try {
        await api('docs/' + DOC_ID + '/sign', { method: 'POST', body: JSON.stringify({ key: ME_KEY, k: TOK, img }) });
        delete $('modal').dataset.lock; closeSheet(); confetti(); toast('✅ Tanda tangan tersimpan di notula');
        await afterChange();
        const s = me(); setTimeout(() => $('pg' + s.page)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
      } catch (e) { sh.querySelector('#pMsg').textContent = '⚠️ Gagal menyimpan: ' + e.message; save.disabled = false; }
    };
  });
}

function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('pustaka PDF gagal dimuat')); document.head.appendChild(sc); });
}
async function downloadPdf() {
  const b = $('dl'); const t = b.textContent; b.disabled = true; b.textContent = 'Menyiapkan PDF...';
  try {
    await loadPdfLib(); const { PDFDocument } = PDFLib;
    const pdf = await PDFDocument.load(await (await fetch(pdfUrl(), { cache: 'no-store' })).arrayBuffer());
    const pages = pdf.getPages(); let n = 0;
    for (const s of S.doc.signers.filter(sigOk)) {
      const pg = pages[s.page - 1]; if (!pg) continue; const { width: W, height: H } = pg.getSize();
      const png = await pdf.embedPng(S.sigs[s.key].img); const bw = s.w * W, bh = s.h * H, sc = Math.min(bw / png.width, 1.65 * bh / png.height);
      const dw = png.width * sc, dh = png.height * sc; pg.drawImage(png, { x: s.x * W + (bw - dw) / 2, y: H - (s.y * H + bh), width: dw, height: dh }); n++;
    }
    pdf.setTitle(S.doc.title);
    const blob = new Blob([await pdf.save()], { type: 'application/pdf' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileName('(Bertanda Tangan)');
    document.body.appendChild(a); a.click(); a.remove(); toast('📄 PDF dibuat (' + n + ' dari ' + S.doc.signers.length + ' tanda tangan)');
  } catch (e) { toast('⚠️ Gagal membuat PDF: ' + e.message); }
  b.disabled = false; b.textContent = t;
}

function openPlacer(signers, pdfUrl, onSave) {
  const list = signers.map(s => ({ ...s, w: s.w || 0.26, h: s.h || 0.06 }));
  let cur = 0;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:45;overflow:auto';
  wrap.innerHTML = `<div style="position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px calc(10px);padding-top:calc(10px + env(safe-area-inset-top))">
    <div class="small" style="margin-bottom:6px">Pilih nama, lalu <b>ketuk</b> letak kolom ttd di halaman. Geser kotak untuk memindah, tarik bulatan biru untuk mengubah ukuran.</div>
    <div class="chips" id="plNames"></div>
    <div class="btns" style="margin-top:8px"><button class="btn sec" id="plCancel">Batal</button><button class="btn" id="plSave">💾 Simpan posisi</button></div></div>
    <div style="max-width:860px;margin:0 auto;padding:12px" id="plPages"></div>`;
  document.body.appendChild(wrap);
  const names = wrap.querySelector('#plNames');
  const drawNames = () => { names.innerHTML = list.map((s, i) => `<button class="chip ${i === cur ? 'on' : ''}" data-i="${i}">${s.x || s.y ? '✓ ' : ''}${esc(s.name)}</button>`).join(''); names.querySelectorAll('.chip').forEach(b => b.onclick = () => { cur = +b.dataset.i; drawNames(); drawBoxes(); }); };
  let pls = [];
  function drawBoxes() {
    pls.forEach(p => p.ov.querySelectorAll('.sbox').forEach(e => e.remove()));
    list.forEach((s, i) => {
      if (!s.x && !s.y) return; const ov = pls[s.page - 1]?.ov; if (!ov) return;
      const b = document.createElement('div'); b.className = 'sbox' + (i === cur ? ' on' : ''); place(b, s.x, s.y, s.w, s.h);
      b.innerHTML = '<span class="lb">' + esc(s.name) + '</span><i class="rz"></i>'; ov.appendChild(b);
      let mode = null, st = null;
      b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); cur = i; drawNames(); b.setPointerCapture(e.pointerId); const r = ov.getBoundingClientRect(); mode = e.target.classList.contains('rz') ? 'rz' : 'mv'; st = { r, x: e.clientX, y: e.clientY, s: { ...s } }; ov.querySelectorAll('.sbox').forEach(x => x.classList.toggle('on', x === b)); });
      b.addEventListener('pointermove', e => { if (!mode) return; const dx = (e.clientX - st.x) / st.r.width, dy = (e.clientY - st.y) / st.r.height;
        if (mode === 'mv') { s.x = Math.max(0, Math.min(1 - s.w, st.s.x + dx)); s.y = Math.max(0, Math.min(1 - s.h, st.s.y + dy)); }
        else { s.w = Math.max(0.06, Math.min(1 - s.x, st.s.w + dx)); s.h = Math.max(0.02, Math.min(1 - s.y, st.s.h + dy)); }
        place(b, s.x, s.y, s.w, s.h); });
      b.addEventListener('pointerup', () => mode = null);
    });
  }
  (async () => {
    const holder = wrap.querySelector('#plPages'); const keep = PAGES, keepPdf = PDF;
    await renderPdf(holder, pdfUrl); pls = PAGES; PAGES = keep; PDF = keepPdf;
    pls.forEach((p, idx) => p.wrap.addEventListener('pointerdown', e => {
      if (e.target.closest('.sbox')) return; const r = p.wrap.getBoundingClientRect(), s = list[cur];
      s.page = idx + 1; s.x = Math.max(0, Math.min(1 - s.w, (e.clientX - r.left) / r.width - s.w / 2)); s.y = Math.max(0, Math.min(1 - s.h, (e.clientY - r.top) / r.height - s.h / 2));
      if (cur < list.length - 1 && list.slice(cur + 1).some(x => !x.x && !x.y)) cur = list.findIndex((x, j) => j > cur && !x.x && !x.y);
      drawNames(); drawBoxes();
    }));
    drawNames(); drawBoxes();
  })();
  wrap.querySelector('#plCancel').onclick = () => wrap.remove();
  wrap.querySelector('#plSave').onclick = async () => {
    const miss = list.filter(s => !s.x && !s.y); if (miss.length && !confirm(miss.length + ' nama belum diberi posisi. Tetap simpan?')) return;
    const btn = wrap.querySelector('#plSave'); btn.disabled = true; btn.textContent = 'Menyimpan...';
    try { await onSave(list.map(({ key, name, role, page, x, y, w, h }) => ({ key, name, role, page, x, y, w, h }))); wrap.remove(); }
    catch (e) { toast('⚠️ ' + e.message); btn.disabled = false; btn.textContent = '💾 Simpan posisi'; }
  };
}

// ---------- deteksi otomatis nama & kolom ttd dari PDF ----------
const normTxt = t => String(t || '').toLowerCase().replace(/[^a-z]/g, '');
async function analyzePdf(url) {
  const doc = await pdfjsLib.getDocument({ url }).promise, pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i), vp = page.getViewport({ scale: 1 }), W = vp.width, H = vp.height;
    const tc = await page.getTextContent(), rows = {};
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const x0 = it.transform[4], base = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
      const key = Math.round(base / 3);
      (rows[key] = rows[key] || []).push({ x0, x1: x0 + (it.width || 0), str: it.str, top: H - base - h, bottom: H - base + h * 0.2 });
    }
    const lines = Object.values(rows).map(items => {
      items.sort((a, b) => a.x0 - b.x0);
      const chars = []; // huruf ternormalisasi beserta posisi x
      for (const it of items) { const n = it.str.length; for (let j = 0; j < n; j++) { const c = it.str[j].toLowerCase(); if (/[a-z]/.test(c)) chars.push({ c, x: it.x0 + (it.x1 - it.x0) * (j / n), x2: it.x0 + (it.x1 - it.x0) * ((j + 1) / n) }); } }
      return { items, chars, norm: chars.map(c => c.c).join(''), text: items.map(i => i.str).join(' '),
        top: Math.min(...items.map(i => i.top)), bottom: Math.max(...items.map(i => i.bottom)) };
    }).sort((a, b) => a.top - b.top);
    pages.push({ W, H, lines, text: lines.map(l => l.text).join('\n') });
  }
  return pages;
}
// ruang kosong (pt) di atas sebuah baris pada rentang x tertentu
function gapAbove(p, l, x0, x1) {
  let best = l.top; // sampai tepi atas halaman
  for (const o of p.lines) {
    if (o === l || o.bottom > l.top - 0.5) continue;
    if (o.items.some(it => it.x1 > x0 && it.x0 < x1)) best = Math.min(best, l.top - o.bottom);
  }
  return best;
}
function detectSigners(pages, candidates) {
  // mulai dari bagian penutup ("Demikian ...") agar nama di daftar hadir/isi tidak ikut
  let sp = 0, sl = 0;
  pages.forEach((p, pi) => p.lines.forEach((l, li) => { if (/demikian|mengetahui|disahkan|notulen/i.test(l.text)) { if (pi > sp || (pi === sp && li > sl)) { sp = pi; sl = li; } } }));
  if (!sp && !sl) sp = pages.length - 1;
  const found = [];
  for (const cand of candidates) {
    const key = normTxt(String(cand.name).replace(/,.*$/, '')); if (key.length < 4) continue;
    let hit = null;
    for (let pi = sp; pi < pages.length; pi++) {
      const p = pages[pi];
      p.lines.forEach((l, li) => {
        if (pi === sp && li < sl) return;
        const at = l.norm.indexOf(key); if (at < 0) return;
        hit = { pi, l, x0: l.chars[at].x, x1: l.chars[at + key.length - 1].x2 };
      });
    }
    if (!hit) continue;
    const p = pages[hit.pi], l = hit.l;
    const after = l.items.filter(it => it.x0 >= hit.x1 - 1);
    const colon = after.find(it => /:/.test(it.str));
    let box;
    if (colon) { // baris "Nama : ........"
      const cx = colon.x0 + (colon.x1 - colon.x0) * (colon.str.indexOf(':') + 1) / Math.max(1, colon.str.length);
      const next = l.items.find(it => it.x0 > cx + 20 && /[a-z]/i.test(it.str) && !/^\.+$/.test(it.str.trim()));
      const x0 = cx + 4, x1 = Math.min(next ? next.x0 - 12 : x0 + 140, x0 + 150, p.W - 25);
      const gap = gapAbove(p, l, x0, x1);
      const up = Math.max(12, Math.min(44, gap - 2));
      box = { x: x0, y: l.top - up, w: Math.max(60, x1 - x0), h: (l.bottom - l.top) + up + 2 };
    } else { // nama di bawah blok jabatan: kolom ttd di atas nama
      const cx = (hit.x0 + hit.x1) / 2, w = 170, bx = Math.max(20, Math.min(p.W - w - 20, cx - w / 2));
      const gap = gapAbove(p, l, bx, bx + w), hh = Math.max(36, Math.min(96, gap - 4));
      box = { x: bx, y: l.top - hh - 2, w, h: hh };
    }
    found.push({ ...cand, page: hit.pi + 1, x: box.x / p.W, y: Math.max(0, box.y) / p.H, w: box.w / p.W, h: box.h / p.H, _ord: hit.pi * 1e6 + l.top * 1e3 + hit.x0 });
  }
  return found.sort((a, b) => a._ord - b._ord).map(({ _ord, ...s }) => s);
}
function guessMeta(pages, fileName) {
  const t = pages.map(p => p.text).join('\n');
  const tgl = (t.match(/Tanggal\s*:\s*([^\n]+)/i) || [])[1], hari = (t.match(/Hari\s*:\s*([A-Za-z']+)/i) || [])[1];
  const agenda = ((t.match(/Agenda\s*:\s*([\s\S]*?)\n\s*(?:Peserta|Jalannya|Daftar|$)/i) || [])[1] || '').replace(/\s+/g, ' ').trim();
  let title = 'Notula ' + (agenda ? agenda.trim().replace(/\s+/g, ' ').replace(/[.;,]+$/, '') : fileName.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').replace(/^notula\s*/i, ''));
  if (title.length > 170) title = title.slice(0, 167).replace(/\s+\S*$/, '') + '...';
  return { title, subtitle: 'Balai Harta Peninggalan Medan' + (tgl ? ' · ' + (hari ? hari.trim() + ', ' : '') + tgl.trim() : '') };
}
function parseSignerText(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [name, ...r] = l.split(/\s+[-–]\s+|\t|;/); return { name: name.trim(), role: r.join(' ').trim() }; });
}
function newDocWizard() {
  let pages = null, pegawai = [], fileUrl = null, detected = [];
  app.innerHTML = `<div class="card"><h2>➕ Notula baru</h2>
    <p class="small" style="margin:0 0 6px">Unggah PDF notula. Judul, tanggal, nama penanda tangan, dan letak kolom ttd akan dideteksi otomatis, lalu tinggal dicek.</p>
    <label class="f">1. Berkas PDF notula</label><input type="file" id="nFile" accept="application/pdf">
    <div id="nScan" class="small" style="margin-top:8px"></div>
    <label class="f">2. Judul</label><input type="text" id="nTitle" placeholder="Terisi otomatis dari Agenda">
    <label class="f">Keterangan (tempat, tanggal)</label><input type="text" id="nSub" placeholder="Terisi otomatis dari Hari dan Tanggal">
    <label class="f">3. Penanda tangan <span style="font-weight:normal">(satu per baris, format: Nama - Jabatan; terisi otomatis, boleh diubah)</span></label>
    <textarea id="nSigners" style="min-height:160px" placeholder="Syuhada - Kurator Keperdataan Ahli Madya&#10;Syafriadi Lubis - Kepala Balai Harta Peninggalan Medan"></textarea>
    <div class="btns" style="margin-top:8px"><button class="btn sec" id="nDetect" disabled>🔍 Deteksi ulang dari PDF</button></div>
    <div class="btns" style="margin-top:12px"><a class="btn sec" style="text-decoration:none;text-align:center" href="${adminHome()}">Batal</a><button class="btn" id="nNext">Lanjut: cek posisi ttd 🎯</button></div></div>`;
  api('pegawai?k=' + encodeURIComponent(ADMIN)).then(x => pegawai = x).catch(() => {});
  async function scan() {
    const f = $('nFile').files[0]; if (!f) return;
    $('nScan').innerHTML = '<span class="spin" style="display:inline-block;vertical-align:middle;width:14px;height:14px"></span> Membaca PDF dan mencari kolom tanda tangan...';
    try {
      fileUrl = URL.createObjectURL(f); pages = await analyzePdf(fileUrl);
      const meta = guessMeta(pages, f.name);
      if (!$('nTitle').value) $('nTitle').value = meta.title;
      if (!$('nSub').value) $('nSub').value = meta.subtitle;
      const typed = parseSignerText($('nSigners').value);
      const cands = typed.length ? typed.map(t => ({ ...t, role: t.role || (pegawai.find(p => normTxt(p.name) === normTxt(t.name)) || {}).role || '' })) : pegawai;
      detected = detectSigners(pages, cands);
      if (!typed.length) $('nSigners').value = detected.map(s => s.name + (s.role ? ' - ' + s.role : '')).join('\n');
      const miss = typed.filter(t => !detected.some(d => normTxt(d.name) === normTxt(t.name)));
      $('nScan').innerHTML = detected.length ? `✅ Ditemukan <b>${detected.length}</b> kolom tanda tangan pada ${pages.length} halaman.${miss.length ? ' ⚠️ Belum ketemu: ' + miss.map(m => esc(m.name)).join(', ') + ' (atur manual di langkah berikut).' : ''}`
        : '⚠️ Kolom tanda tangan tidak terdeteksi. Isi nama secara manual, lalu atur posisinya di langkah berikut.';
      $('nDetect').disabled = false;
    } catch (e) { $('nScan').textContent = '⚠️ PDF tidak dapat dibaca: ' + e.message; }
  }
  $('nFile').onchange = () => { detected = []; $('nSigners').value = ''; $('nTitle').value = ''; $('nSub').value = ''; scan(); };
  $('nDetect').onclick = scan;
  $('nNext').onclick = () => {
    const f = $('nFile').files[0], title = $('nTitle').value.trim();
    if (!f) return toast('Pilih berkas PDF dulu'); if (!title) return toast('Isi judul dulu');
    const typed = parseSignerText($('nSigners').value);
    if (!typed.length) return toast('Isi minimal satu penanda tangan');
    const signers = typed.map(t => { const d = detected.find(x => normTxt(x.name) === normTxt(t.name)); return d ? { ...d, name: t.name, role: t.role || d.role } : { name: t.name, role: t.role, page: 1, x: 0, y: 0 }; });
    openPlacer(signers, fileUrl || URL.createObjectURL(f), async list => {
      const r = await api('docs', { method: 'POST', body: JSON.stringify({ k: ADMIN, title, subtitle: $('nSub').value.trim(), pdf: await fileB64(f), signers: list }) });
      confetti(); location.href = adminDoc(r.id);
    });
  };
}

if (ADMIN && !DOC_ID && (ADMIN_URL || qs.has('kelola'))) showAdminHome();
else if (DOC_ID) showDoc();
else showLanding();
function showLanding() {
  $('hTitle').textContent = 'Notula Seksi Harta Peninggalan Wilayah II'; $('hSub').textContent = 'Tanda tangan dan koreksi notula secara digital';
  app.innerHTML = `<div class="card"><div class="big-emoji">✍️</div><p style="text-align:center">Silakan buka link notula yang dikirimkan kepada Bapak/Ibu.<br><span class="small">Setiap notula hanya dapat dibuka melalui link pribadi masing-masing.</span></p>
    <div class="btns">${ADMIN ? '<a class="btn" style="text-decoration:none;text-align:center" href="/?kelola">🛠️ Buka panel admin</a>' : '<button class="btn sec" id="login">🔐 Masuk Admin</button>'}</div></div>`;
  const lb = $('login'); if (!lb) return;
  lb.onclick = () => openSheet(`<h3>🔐 Masuk Admin</h3><p class="lead">Masukkan password admin untuk mengelola notula.</p>
    <form id="lf"><input type="password" id="pw" autocomplete="current-password" placeholder="Password" style="width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #dbe1ec;border-radius:12px">
    <div class="small" id="lmsg" style="margin-top:6px;color:var(--bad)"></div>
    <div class="btns" style="margin-top:12px"><button type="button" class="btn sec" onclick="closeSheet()">Batal</button><button class="btn" id="lgo">Masuk</button></div></form>`, sh => {
    setTimeout(() => sh.querySelector('#pw').focus(), 250);
    sh.querySelector('#lf').onsubmit = async e => {
      e.preventDefault(); const pw = sh.querySelector('#pw').value.trim(); if (!pw) return;
      sh.querySelector('#lgo').disabled = true;
      try { await api('docs?k=' + encodeURIComponent(pw)); try { localStorage.setItem('adminKey', pw); } catch (er) {} location.href = '/?kelola'; }
      catch (er) { sh.querySelector('#lmsg').textContent = 'Password salah. Coba lagi.'; sh.querySelector('#lgo').disabled = false; }
    };
  });
}
